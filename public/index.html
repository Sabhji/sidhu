<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Vulnerability Scanner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .scan-box {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="url"] {
            flex: 1;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input[type="url"]:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            padding: 15px 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .loading {
            text-align: center;
            padding: 20px;
            display: none;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .results {
            display: none;
        }

        .score-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            margin-bottom: 30px;
        }

        .score {
            font-size: 4em;
            font-weight: bold;
            margin: 10px 0;
        }

        .vulnerability-section {
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 1.5em;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e0e0e0;
        }

        .vulnerability-card {
            background: #fff;
            border-left: 4px solid;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .vulnerability-card.high {
            border-left-color: #e74c3c;
            background: #fef5f5;
        }

        .vulnerability-card.medium {
            border-left-color: #f39c12;
            background: #fef9f5;
        }

        .vulnerability-card.low {
            border-left-color: #3498db;
            background: #f5f9fe;
        }

        .vulnerability-card.passed {
            border-left-color: #2ecc71;
            background: #f5fef8;
        }

        .severity-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.85em;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .severity-high {
            background: #e74c3c;
            color: white;
        }

        .severity-medium {
            background: #f39c12;
            color: white;
        }

        .severity-low {
            background: #3498db;
            color: white;
        }

        .severity-passed {
            background: #2ecc71;
            color: white;
        }

        .issue-title {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .recommendation {
            color: #666;
            font-size: 0.95em;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔒 Website Vulnerability Scanner</h1>
            <p>Scan websites for common security vulnerabilities</p>
        </div>

        <div class="scan-box">
            <div class="input-group">
                <input type="url" id="urlInput" placeholder="Enter website URL (e.g., https://example.com)" required>
                <button id="scanBtn" onclick="scanWebsite()">Scan Now</button>
            </div>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p style="margin-top: 10px;">Scanning website...</p>
            </div>

            <div class="results" id="results">
                <div class="score-card">
                    <h2>Security Score</h2>
                    <div class="score" id="score">0</div>
                    <p id="scoreText">out of 100</p>
                </div>

                <div class="vulnerability-section" id="vulnerabilitiesSection" style="display: none;">
                    <h2 class="section-title">🚨 Vulnerabilities Found</h2>
                    <div id="vulnerabilities"></div>
                </div>

                <div class="vulnerability-section" id="warningsSection" style="display: none;">
                    <h2 class="section-title">⚠️ Warnings</h2>
                    <div id="warnings"></div>
                </div>

                <div class="vulnerability-section" id="passedSection" style="display: none;">
                    <h2 class="section-title">✅ Passed Checks</h2>
                    <div id="passed"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function scanWebsite() {
            const urlInput = document.getElementById('urlInput');
            const url = urlInput.value.trim();

            if (!url) {
                alert('Please enter a URL');
                return;
            }

            // Show loading
            document.getElementById('loading').style.display = 'block';
            document.getElementById('results').style.display = 'none';
            document.getElementById('scanBtn').disabled = true;

            try {
                const response = await fetch('/api/scan', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ url })
                });

                const data = await response.json();

                if (response.ok) {
                    displayResults(data);
                } else {
                    alert('Error: ' + (data.error || 'Scan failed'));
                }
            } catch (error) {
                alert('Error: ' + error.message);
            } finally {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('scanBtn').disabled = false;
            }
        }

        function displayResults(data) {
            document.getElementById('score').textContent = data.score;
            
            // Display vulnerabilities
            displaySection('vulnerabilities', data.vulnerabilities, 'vulnerabilitiesSection');
            displaySection('warnings', data.warnings, 'warningsSection');
            displaySection('passed', data.passed, 'passedSection');

            document.getElementById('results').style.display = 'block';
        }

        function displaySection(containerId, items, sectionId) {
            const container = document.getElementById(containerId);
            const section = document.getElementById(sectionId);

            if (items.length === 0) {
                section.style.display = 'none';
                return;
            }

            section.style.display = 'block';
            container.innerHTML = '';

            items.forEach(item => {
                const card = document.createElement('div');
                const severity = item.severity ? item.severity.toLowerCase() : 'passed';
                card.className = `vulnerability-card ${severity}`;

                let html = '';
                
                if (item.severity) {
                    html += `<span class="severity-badge severity-${severity}">${item.severity}</span><br>`;
                }

                if (item.type) {
                    html += `<div class="issue-title">${item.type}: ${item.issue || item.message}</div>`;
                }

                if (item.recommendation) {
                    html += `<div class="recommendation">💡 ${item.recommendation}</div>`;
                }

                if (item.details) {
                    html += `<div class="recommendation">Details: ${item.details.join(', ')}</div>`;
                }

                card.innerHTML = html;
                container.appendChild(card);
            });
        }

        // Allow Enter key to trigger scan
        document.getElementById('urlInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                scanWebsite();
            }
        });
    </script>
</body>
</html>
